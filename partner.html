<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статистика партнёра — GeodeForge</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0; }
  .kp div { border: 1px solid #262626; border-radius: 14px; padding: 16px; background: #111; }
  .kp b { display: block; font-size: 28px; color: #fff; }
  .kp span { color: #8a8a8a; font-size: 13px; }
  .bars { width: 100%; height: 140px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #222; }
  th { color: #8a8a8a; font-weight: 600; }
  .lnk { border: 1px dashed #333; border-radius: 12px; padding: 12px 14px; font: 14px "JetBrains Mono", monospace; word-break: break-all; cursor: pointer; }
</style>
</head>
<body>
<main class="wrap" style="max-width:820px;padding-top:50px;padding-bottom:80px">
  <a class="brand" href="./" style="margin-bottom:34px">
    <svg viewBox="0 0 40 40" fill="none" width="26" height="26"><rect x="4.5" y="4.5" width="31" height="31" rx="5" stroke="#fff" stroke-width="1.6"/><rect x="11" y="11" width="18" height="18" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M20 15v10M15 20h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    GeodeForge
  </a>
  <div id="box"><p class="dim">Загружаю…</p></div>
</main>
<script src="config.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const box = document.getElementById("box");
  try {
    const r = await fetch(GF.api + "/partner", { method: "POST", headers: { "Content-Type": "application/json", apikey: GF.anon, Authorization: "Bearer " + GF.anon }, body: JSON.stringify({ code: q.get("code"), k: q.get("k") }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const link = location.origin + location.pathname.replace(/partner\.html$/, "") + "?ref=" + d.code + "&promo=" + d.code;
    const days = Object.entries(d.series);
    const max = Math.max(1, ...days.map(([, v]) => v.visits));
    const w = 100 / days.length;
    box.innerHTML = `
      <h2 style="margin:0">Привет, ${esc(d.name)}! 👋</h2>
      <p class="dim">Твой промокод <b style="color:#fff">${esc(d.code)}</b> даёт зрителям скидку ${d.discount}%, а тебе — ${d.reward_percent}% с каждой покупки.</p>
      <div class="kp">
        <div><b>${d.visits}</b><span>переходов по ссылке</span></div>
        <div><b>${d.sales}</b><span>покупок с твоим кодом</span></div>
        <div><b>${d.money} ₽</b><span>сумма покупок</span></div>
        <div><b>${d.earned} ₽</b><span>твой заработок</span></div>
      </div>
      <div class="dim" style="margin-bottom:6px">Переходы за 30 дней (белым — покупки)</div>
      <svg class="bars" viewBox="0 0 100 40" preserveAspectRatio="none">${days.map(([day, v], i) => `<rect x="${i * w + w * 0.15}" y="${40 - (v.visits / max) * 38}" width="${w * 0.7}" height="${(v.visits / max) * 38}" fill="#3a3a3a"><title>${day}: ${v.visits}</title></rect>${v.sales ? `<rect x="${i * w + w * 0.15}" y="${40 - Math.min(38, v.sales * 6)}" width="${w * 0.7}" height="${Math.min(38, v.sales * 6)}" fill="#fff"><title>${day}: покупок ${v.sales}</title></rect>` : ""}`).join("")}</svg>
      <h3 style="margin-top:30px">Твоя ссылка для зрителей</h3>
      <div class="lnk" id="lnk" title="Нажми, чтобы скопировать">${esc(link)}</div>
      <p class="dim" style="font-size:13px">Вставь её в описание видео или пост. Промокод зрители могут ввести и вручную: <b style="color:#fff">${esc(d.code)}</b>.</p>
      ${d.recent.length ? `<h3 style="margin-top:30px">Последние покупки</h3><table><tr><th>Когда</th><th>Что</th><th>Сумма</th></tr>${d.recent.map((x) => `<tr><td>${new Date(x.at).toLocaleString("ru-RU")}</td><td>${x.plan === "pro" ? "Про" : x.plan === "basic" ? "Базовая" : esc(x.plan)}</td><td>${x.amount} ₽</td></tr>`).join("")}</table>` : ""}
      <p class="dim" style="margin-top:30px;font-size:13px">Выплаты — по договорённости с разработчиком: <a href="${GF.telegram}">${GF.telegram.replace("https://", "")}</a></p>`;
    document.getElementById("lnk").onclick = () => { navigator.clipboard.writeText(link); document.getElementById("lnk").textContent = "Скопировано ✓"; setTimeout(() => (document.getElementById("lnk").textContent = link), 1500); };
  } catch (e) {
    box.innerHTML = "<h2>Ссылка неверная</h2><p class='dim'>Попроси у разработчика новую ссылку на статистику.</p>";
  }
})();
</script>
</body>
</html>
